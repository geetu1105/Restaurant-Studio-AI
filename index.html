<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Start to End Restaurant Studio</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, system-ui, sans-serif;
      background: #f9fafb;
      color: #111827;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    .page { max-width: 960px; margin: 0 auto; padding: 24px; }
    header { margin-bottom: 24px; }
    h1 { margin: 0 0 12px; font-size: clamp(2rem, 3vw, 3rem); line-height: 1.05; }
    p.lead { margin: 0; color: #4b5563; max-width: 720px; }
    .status, .error-box { background: #fff; border: 1px solid #d1d5db; border-radius: 16px; padding: 16px; margin-bottom: 20px; }
    .status strong, .error-box strong { display: block; margin-bottom: 8px; }
    .error-box { border-color: #fca5a5; background: #fef2f2; color: #991b1b; }
    .button-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
    button { border: none; border-radius: 999px; padding: 12px 18px; cursor: pointer; font-weight: 600; transition: transform .1s ease, box-shadow .15s ease; }
    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: .65; cursor: not-allowed; transform: none; }
    .primary { background: #2563eb; color: white; box-shadow: 0 18px 40px rgba(37,99,235,.18); }
    .secondary { background: #e5e7eb; color: #111827; }
    .secondary:hover { background: #d1d5db; }
    .list-card { background: white; border: 1px solid #e5e7eb; border-radius: 18px; padding: 18px; }
    .ideas-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    .ideas-list button { width: 100%; text-align: left; background: #f8fafc; border: 1px solid #d1d5db; padding: 16px; border-radius: 16px; color: #111827; }
    .ideas-list button:hover { border-color: #93c5fd; background: #eff6ff; }
    .section { background: white; border: 1px solid #e5e7eb; border-radius: 18px; padding: 18px; margin-bottom: 18px; }
    .section h2 { margin-top: 0; font-size: 1.15rem; }
    .section p, .section pre { margin: 0.75rem 0 0; white-space: pre-wrap; line-height: 1.65; }
    .text-field { width: 100%; min-height: 96px; resize: vertical; padding: 14px 16px; border-radius: 16px; border: 1px solid #d1d5db; font: inherit; line-height: 1.6; }
    .text-field:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 4px rgba(59,130,246,.12); }
    .copy-success { color: #16a34a; margin-left: 12px; }
    .final-concept pre { background: #f8fafc; border-radius: 16px; padding: 18px; white-space: pre-wrap; }
    .small-note { color: #6b7280; font-size: 0.95rem; margin-top: 10px; }
    @media (max-width: 720px) { .button-row { flex-direction: column; } }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Start to End Restaurant Studio</h1>
      <p class="lead">Build a restaurant concept from idea to final review with three friendly AI teammates. Approve each handoff and keep every step. Perfect for students ages 8–18.</p>
    </header>

    <div id="status" class="status" hidden></div>
    <div id="error" class="error-box" hidden></div>

    <main id="app"></main>
  </div>

  <script>
    const CLASSROOM_PROXY = '/classroom-proxy';
    const app = document.getElementById('app');
    const statusEl = document.getElementById('status');
    const errorEl = document.getElementById('error');

    let currentStage = 'ideas';
    let ideas = [];
    let selectedIdea = null;
    let restaurantConcept = null;
    let officialConcept = null;
    let reviewResult = null;
    let activeAgent = null;
    let lastAgentError = null;

    function setStatus(message) {
      if (!message) {
        statusEl.hidden = true;
        statusEl.textContent = '';
        return;
      }
      statusEl.hidden = false;
      statusEl.innerHTML = `<strong>${message}</strong>`;
    }

    function setError(message, retryFn) {
      if (!message) {
        errorEl.hidden = true;
        errorEl.innerHTML = '';
        lastAgentError = null;
        return;
      }
      lastAgentError = retryFn;
      errorEl.hidden = false;
      const retryButton = retryFn ? `<button class="primary" onclick="retryAgent()">Retry</button>` : '';
      errorEl.innerHTML = `<strong>Error</strong><div>${escapeHtml(message)}</div><div class="button-row" style="margin-top:14px;">${retryButton}</div>`;
    }

    function escapeHtml(value) {
      return value
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function askAgentPersona(persona, instructions, payload) {
      activeAgent = persona;
      setError(null, null);
      setStatus(`${persona} is working: ${instructions.description}`);
      try {
        const body = {
          persona,
          instructions: instructions.prompt,
          payload,
        };
        const response = await fetch(CLASSROOM_PROXY, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(errorText || `Proxy returned status ${response.status}`);
        }
        const data = await response.json();
        if (!data) throw new Error('Empty proxy response');
        // proxy returns { text: '...json...' }
        const raw = typeof data.text === 'string' ? data.text.trim() : data.text;
        // Try to parse JSON safely and return parsed object when possible
        if (typeof raw === 'string') {
          try {
            return JSON.parse(raw);
          } catch (e) {
            // not JSON, return raw string so callers can attempt parsing
            return raw;
          }
        }
        return raw;
      } catch (error) {
        throw new Error(error.message || 'Unknown request error');
      } finally {
        activeAgent = null;
        setStatus('');
      }
    }

    function retryAgent() {
      if (typeof lastAgentError === 'function') {
        lastAgentError();
      }
    }

    function render() {
      setError(null, null);
      if (currentStage === 'ideas') {
        renderIdeas();
      } else if (currentStage === 'design') {
        renderDesign();
      } else if (currentStage === 'approve') {
        renderApproval();
      } else if (currentStage === 'final') {
        renderFinal();
      }
    }

    function renderIdeas() {
      app.innerHTML = `
        <section class="section list-card">
          <h2>Restaurant Ideas</h2>
          <p>Pick one idea to send to the restaurant designer. You can ask for more ideas any time.</p>
          ${ideas.length ? `<ul class="ideas-list">${ideas.map((idea, index) => `
            <li>
              <button type="button" data-index="${index}">
                <strong>${escapeHtml(idea.name)}</strong><br>
                <em>${escapeHtml(idea.theme)}</em><br>
                <span>${escapeHtml(idea.why)}</span>
              </button>
            </li>`).join('')}</ul>` : '<p>Waiting for restaurant ideas to arrive...</p>'}
          <div class="button-row">
            <button class="secondary" id="moreIdeasBtn">More Ideas</button>
          </div>
        </section>
      `;
      document.getElementById('moreIdeasBtn').addEventListener('click', fetchIdeas);
      app.querySelectorAll('.ideas-list button').forEach(button => {
        button.addEventListener('click', () => {
          const index = Number(button.dataset.index);
          selectIdea(index);
        });
      });
    }

    function renderDesign() {
      const plan = restaurantConcept || officialConcept || { design: {}, menu: [], recipes: [] };
      const chosenIdea = selectedIdea ? `${selectedIdea.name} — ${selectedIdea.theme}` : 'Selected restaurant idea';
      app.innerHTML = `
        <section class="section">
          <h2>Your Restaurant Concept</h2>
          <p>This is the complete concept from the designer. Edit any section and save it before approval.</p>
          <p><strong>Based on:</strong> ${escapeHtml(chosenIdea)}</p>
          <div id="conceptSections"></div>
          <div class="button-row">
            <button class="secondary" id="editConceptBtn">Edit Draft</button>
            <button class="primary" id="saveConceptBtn">Save official version</button>
            <button class="secondary" id="openKitchenBtn">Open Cooking Game</button>
          </div>
          <div class="small-note">After saving, approve to send the concept to the reviewer.</div>
        </section>
        <section id="kitchenSection" class="section" style="display:none;">
          <h2>Interactive Cooking Game</h2>
          <div id="kitchenArea"></div>
        </section>
      `;
      renderConceptSections(plan, false);
      document.getElementById('editConceptBtn').addEventListener('click', () => renderConceptSections(plan, true));
      document.getElementById('saveConceptBtn').addEventListener('click', saveEditedConcept);
      document.getElementById('openKitchenBtn').addEventListener('click', () => {
        document.getElementById('kitchenSection').style.display = '';
        renderKitchen(plan.recipes || []);
      });
    }

    function renderConceptSections(plan, editing) {
      const container = document.getElementById('conceptSections');
      const fields = [
        { key: 'theme', title: 'Restaurant Theme' },
        { key: 'decorations', title: 'Decorations' },
        { key: 'colors', title: 'Colors' },
        { key: 'layout', title: 'Layout' },
        { key: 'mascot', title: 'Mascot' },
        { key: 'specialFeatures', title: 'Special Features' },
        { key: 'customerExperience', title: 'Customer Experience' }
      ];
      container.innerHTML = fields.map(field => {
        const value = (plan.design && plan.design[field.key]) || plan[field.key] || '';
        if (editing) {
          return `
            <section class="section">
              <h2>${field.title}</h2>
              <textarea class="text-field" data-field="${field.key}">${escapeHtml(value)}</textarea>
            </section>`;
        }
        return `
          <section class="section">
            <h2>${field.title}</h2>
            <p>${escapeHtml(value)}</p>
          </section>`;
      }).join('') + renderMenuAndRecipes(plan);
      if (editing) {
        container.querySelectorAll('textarea').forEach(textarea => {
          autoGrow(textarea);
          textarea.addEventListener('input', () => autoGrow(textarea));
        });
      }
    }

    function renderMenuAndRecipes(plan) {
      const menu = plan.menu || (plan.design && plan.design.menu) || [];
      const recipes = plan.recipes || [];
      const menuHtml = `
        <section class="section">
          <h2>Menu</h2>
          <ul>${menu.map(item => `<li><strong>${escapeHtml(item.name)}</strong> — ${escapeHtml(item.description || item.category || '')}</li>`).join('')}</ul>
        </section>`;
      const recipesHtml = `
        <section class="section">
          <h2>Recipes</h2>
          <div>${recipes.map((r, i) => `
            <div style="margin-bottom:12px;">
              <strong>${escapeHtml(r.name)}</strong>
              <div>${escapeHtml((r.ingredients || []).join(', '))}</div>
              <div style="margin-top:6px;"><em>Steps:</em><pre>${escapeHtml((r.steps || []).join('\n'))}</pre></div>
            </div>
          `).join('')}</div>
        </section>`;
      return menuHtml + recipesHtml;
    }

    function autoGrow(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = `${textarea.scrollHeight}px`;
    }

    function saveEditedConcept() {
      const textareas = app.querySelectorAll('textarea[data-field]');
      if (!textareas.length) {
        setError('Open Edit mode before saving.', null);
        return;
      }
      const updated = {};
      textareas.forEach(textarea => {
        updated[textarea.dataset.field] = textarea.value.trim();
      });
      officialConcept = { ...restaurantConcept, ...updated };
      restaurantConcept = officialConcept;
      currentStage = 'approve';
      render();
    }

    function renderApproval() {
      app.innerHTML = `
        <section class="section">
          <h2>Ready for Final Review</h2>
          <p>Review the official restaurant concept and send it to the reviewer when you are ready.</p>
          <div class="section"><pre>${escapeHtml(formatOfficialConcept(officialConcept))}</pre></div>
          <div class="button-row">
            <button class="secondary" id="backToEditBtn">Back to Edit</button>
            <button class="primary" id="approveBtn">Approve and Review</button>
          </div>
        </section>
      `;
      document.getElementById('backToEditBtn').addEventListener('click', () => {
        currentStage = 'design';
        render();
      });
      document.getElementById('approveBtn').addEventListener('click', fetchReview);
    }

    function formatOfficialConcept(plan) {
      return [
        `Theme: ${plan.theme || ''}`,
        `Menu Items: ${plan.menu || ''}`,
        `Drinks: ${plan.drinks || ''}`,
        `Desserts: ${plan.desserts || ''}`,
        `Decorations: ${plan.decorations || ''}`,
        `Colors: ${plan.colors || ''}`,
        `Layout: ${plan.layout || ''}`,
        `Customer Experience: ${plan.customerExperience || ''}`,
        `Special Features: ${plan.specialFeatures || ''}`,
        `Logo Idea: ${plan.logoIdea || ''}`,
        `Slogan: ${plan.slogan || ''}`
      ].join('\n\n');
    }

    function renderFinal() {
      app.innerHTML = `
        <section class="section final-concept">
          <h2>Final Restaurant Concept</h2>
          <p>The reviewer improved your concept and explained how to make it even better.</p>
          <div class="section"><h3>Reviewer Critique</h3><pre>${escapeHtml(reviewResult.critique)}</pre></div>
          <div class="section"><h3>Improved Final Restaurant Concept</h3><pre>${escapeHtml(reviewResult.improved)}</pre></div>
          <div class="section"><h3>Your Creations</h3>${renderMenuAndRecipes({ menu: officialConcept.menu || [], recipes: officialConcept.recipes || [] })}</div>
          <div class="button-row">
            <button class="primary" id="copyBtn">Copy Final Concept</button>
            <button class="secondary" id="newRestaurantBtn">Start a New Restaurant</button>
          </div>
          <div id="copySuccess" class="copy-success" hidden>Copied to clipboard!</div>
        </section>
      `;
      document.getElementById('copyBtn').addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(`Final Restaurant Concept\n\nCritique:\n${reviewResult.critique}\n\nImproved Restaurant Concept:\n${reviewResult.improved}`);
          const successEl = document.getElementById('copySuccess');
          successEl.hidden = false;
          setTimeout(() => { successEl.hidden = true; }, 2500);
        } catch (err) {
          setError('Unable to copy. Please use your browser copy shortcut.', null);
        }
      });
      document.getElementById('newRestaurantBtn').addEventListener('click', () => {
        ideas = [];
        selectedIdea = null;
        restaurantConcept = null;
        officialConcept = null;
        reviewResult = null;
        currentStage = 'ideas';
        fetchIdeas();
      });
    }

    function selectIdea(index) {
      selectedIdea = ideas[index];
      fetchDesign(selectedIdea);
    }

    async function fetchIdeas() {
      const persona = 'Agent 1: Restaurant Idea Generator';
      const instructions = {
        description: 'Generating five fun restaurant concepts for students aged 8–18.',
        prompt: `You are a creative restaurant brainstorming partner who helps students create exciting restaurant ideas. Every response must be safe and appropriate for ages 8–18. Generate exactly 5 restaurant concepts. Return only valid JSON with an array of objects. Each object must include: name, theme, why. Example format: [{"name": "...", "theme": "...", "why": "..."}]. Do not include any extra text.`
      };
      try {
        const text = await askAgentPersona(persona, instructions, { stage: 'ideas' });
        ideas = parseAgent1(text);
        currentStage = 'ideas';
        render();
      } catch (error) {
        setError(error.message, fetchIdeas);
      }
    }

    function parseAgent1(text) {
      let parsed = text;
      if (typeof text === 'string') {
        try {
          parsed = JSON.parse(text);
        } catch (e) {
          throw new Error('Could not read the restaurant ideas. Make sure the proxy output is valid JSON.');
        }
      }
      if (!Array.isArray(parsed) || parsed.length !== 5) {
        throw new Error('Agent 1 response did not contain exactly 5 ideas.');
      }
      return parsed.map(item => ({
        name: String(item.name || '').trim(),
        theme: String(item.theme || '').trim(),
        why: String(item.why || '').trim(),
      }));
    }

    // Game and progression state
    let chefXP = 0;
    let chefLevel = 1;
    const recipeBook = [];
    const unlocked = { ingredients: new Set(['Water', 'Salt']), decorations: new Set() };

    async function fetchDesign(idea) {
      const persona = 'Agent 2: Restaurant Designer';
      const instructions = {
        description: 'Designing your restaurant and creating menu items with recipes (JSON output).',
        prompt: `You are a creative chef and restaurant designer. Turn the approved idea into a complete restaurant design, menu, and recipes. Return only valid JSON with this shape: {"design": { name, theme, colors, decorations, layout, mascot, specialFeatures, customerExperience }, "menu": [{"name","category","description"}], "recipes": [{"name","ingredients":[...],"steps":[...],"presentation":"..."}] }. Keep content friendly for ages 8-18. Do not include any extra text.`
      };
      try {
        const text = await askAgentPersona(persona, instructions, { stage: 'design', idea });
        restaurantConcept = parseAgent2(text);
        // ensure basic fields
        restaurantConcept.design = restaurantConcept.design || { name: idea.name, theme: idea.theme };
        officialConcept = { ...restaurantConcept.design, menu: restaurantConcept.menu, recipes: restaurantConcept.recipes };
        currentStage = 'design';
        render();
      } catch (error) {
        setError(error.message, () => fetchDesign(idea));
      }
    }

    function parseAgent2(obj) {
      // Accept either a JSON string or a parsed object and normalize to { design, menu, recipes }
      let parsed = obj;
      if (typeof obj === 'string') {
        try {
          parsed = JSON.parse(obj);
        } catch (e) {
          throw new Error('Designer response was not valid JSON.');
        }
      }
      if (!parsed || typeof parsed !== 'object') {
        throw new Error('Designer returned an unexpected response.');
      }
      // If the proxy returned the new schema, map to internal shape
      if (parsed.restaurantName || parsed.theme || parsed.menu) {
        const design = {
          name: parsed.restaurantName || parsed.design?.name || selectedIdea?.name || '',
          theme: parsed.theme || parsed.design?.theme || selectedIdea?.theme || '',
          colors: Array.isArray(parsed.colors) ? parsed.colors.join(', ') : (parsed.colors || parsed.design?.colors || '').toString(),
          decorations: Array.isArray(parsed.decorations) ? parsed.decorations.join(', ') : (parsed.decorations || parsed.design?.decorations || '').toString(),
          layout: parsed.layout || parsed.design?.layout || '',
          mascot: parsed.mascot || parsed.design?.mascot || '',
          specialFeatures: Array.isArray(parsed.specialFeatures) ? parsed.specialFeatures.join(', ') : (parsed.specialFeatures || parsed.design?.specialFeatures || '').toString(),
          customerExperience: parsed.customerExperience || parsed.design?.customerExperience || ''
        };
        const menu = Array.isArray(parsed.menu) ? parsed.menu : (parsed.menu || []);
        const recipes = Array.isArray(parsed.recipes) ? parsed.recipes : (parsed.recipes || []);
        return { design, menu, recipes };
      }
      // Fallback: if agent returned { design, menu, recipes }
      if (parsed.design) {
        const menu = Array.isArray(parsed.menu) ? parsed.menu : [];
        const recipes = Array.isArray(parsed.recipes) ? parsed.recipes : [];
        return { design: parsed.design, menu, recipes };
      }
      throw new Error('Designer output missing required fields (restaurantName/theme/menu/recipes).');
    }

    async function fetchReview() {
      if (!officialConcept) {
        setError('There is no official concept to review yet.', null);
        return;
      }
      const persona = 'Agent 3: Restaurant Reviewer';
      const instructions = {
        description: 'Reviewing the finished restaurant concept with clear, encouraging feedback.',
        prompt: `You are a strict but encouraging restaurant expert. Read the approved restaurant concept and return two sections. First, a short bullet-point critique labeled Critique:, with each bullet explaining exactly what an 8–18 year old student can improve. Second, an improved final restaurant version labeled Improved Restaurant Concept:. Never use sarcasm. Return only those two sections in plain text.`
      };
      try {
        const text = await askAgentPersona(persona, instructions, { stage: 'review', concept: officialConcept });
        reviewResult = parseAgent3(text);
        // merge improved version into officialConcept for final showcase
        try {
          const improvedJson = tryExtractJson(reviewResult.improved);
          if (improvedJson && improvedJson.design) {
            officialConcept = { ...officialConcept, ...improvedJson.design, menu: improvedJson.menu || officialConcept.menu, recipes: improvedJson.recipes || officialConcept.recipes };
          }
        } catch (e) {
          // ignore if improved is plain text
        }
        currentStage = 'final';
        render();
      } catch (error) {
        setError(error.message, fetchReview);
      }
    }

    function parseAgent3(text) {
      const critiqueMatch = text.match(/Critique:\s*([\s\S]*?)(?:\n\s*Improved Restaurant Concept:|$)/i);
      const improvedMatch = text.match(/Improved Restaurant Concept:\s*([\s\S]*?)$/i);
      const critique = critiqueMatch ? critiqueMatch[1].trim() : '';
      const improved = improvedMatch ? improvedMatch[1].trim() : '';
      return { critique, improved };
    }

    function tryExtractJson(text) {
      try {
        const maybe = text.trim();
        if (maybe.startsWith('{') || maybe.startsWith('[')) return JSON.parse(maybe);
      } catch (e) {
        return null;
      }
      return null;
    }

    // Kitchen / cooking game helpers
    function renderKitchen(recipes) {
      const kitchen = document.getElementById('kitchenArea');
      if (!recipes.length) {
        kitchen.innerHTML = `<div class="small-note">No recipes available yet. Save the official concept with recipes first.</div>`;
        return;
      }
      kitchen.innerHTML = recipes.map((r, idx) => `
        <div class="section" style="display:flex;gap:12px;align-items:flex-start;">
          <div style="flex:1;">
            <h3>${escapeHtml(r.name)}</h3>
            <div><strong>Ingredients:</strong></div>
            <div class="ingredients" data-idx="${idx}">
              ${(r.ingredients || []).map(ing => `<div class="draggable" draggable="true" data-ingredient="${escapeHtml(ing)}" style="display:inline-block;padding:6px 10px;border-radius:999px;background:#f3f4f6;margin:6px;border:1px solid #e5e7eb;">${escapeHtml(ing)}</div>`).join('')}
            </div>
            <div style="margin-top:8px;"><strong>Steps:</strong><pre>${escapeHtml((r.steps || []).join('\n'))}</pre></div>
          </div>
          <div style="width:260px;">
            <div style="border:1px dashed #d1d5db;border-radius:12px;padding:12px;min-height:140px;" data-dropzone-idx="${idx}">Drop ingredients here</div>
            <div style="margin-top:8px;display:flex;gap:8px;">
              <button class="primary" data-action="check" data-idx="${idx}">Check Recipe</button>
              <button class="secondary" data-action="decorate" data-idx="${idx}">Decorate</button>
            </div>
            <div class="small-note" data-progress-idx="${idx}">Progress: 0/${(r.ingredients || []).length}</div>
          </div>
        </div>`).join('');

      kitchen.querySelectorAll('.draggable').forEach(el => {
        el.addEventListener('dragstart', e => {
          e.dataTransfer.setData('text/plain', el.dataset.ingredient);
        });
      });
      kitchen.querySelectorAll('[data-dropzone-idx]').forEach(zone => {
        zone.addEventListener('dragover', e => e.preventDefault());
        zone.addEventListener('drop', e => {
          e.preventDefault();
          const ing = e.dataTransfer.getData('text/plain');
          if (!ing) return;
          const badge = document.createElement('div');
          badge.textContent = ing;
          badge.style.display = 'inline-block';
          badge.style.padding = '6px 10px';
          badge.style.margin = '6px';
          badge.style.borderRadius = '999px';
          badge.style.background = '#fff7ed';
          badge.style.border = '1px solid #f3e1c0';
          zone.appendChild(badge);
          const idx = Number(zone.dataset.dropzoneIdx);
          const progressEl = document.querySelector(`[data-progress-idx="${idx}"]`);
          const count = zone.querySelectorAll('div').length;
          progressEl.textContent = `Progress: ${count}/${(recipes[idx].ingredients || []).length}`;
        });
      });
      kitchen.querySelectorAll('button[data-action="check"]').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.dataset.idx);
          const zone = kitchen.querySelector(`[data-dropzone-idx="${idx}"]`);
          const placed = Array.from(zone.querySelectorAll('div')).map(d => d.textContent.trim());
          const needed = (recipes[idx].ingredients || []).map(i => String(i).trim());
          const matched = needed.filter(n => placed.includes(n)).length;
          if (matched === needed.length) {
            chefXP += 10;
            if (chefXP >= chefLevel * 50) { chefLevel++; chefXP = 0; }
            alert(`Great job! You completed ${recipes[idx].name}. XP +10. Level ${chefLevel}`);
          } else {
            alert(`Not quite yet. You added ${matched} of ${needed.length} ingredients.`);
          }
        });
      });
      kitchen.querySelectorAll('button[data-action="decorate"]').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.dataset.idx);
          const dec = prompt('Choose a decoration (e.g., sprinkles, fruit slice):', 'sprinkles');
          if (dec) {
            unlocked.decorations.add(dec);
            alert(`Added decoration: ${dec}.`);
          }
        });
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      render();
      fetchIdeas();
    });
  </script>
</body>
</html>
